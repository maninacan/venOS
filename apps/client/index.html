<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Client</title>
    <base href="/" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/src/styles.css" />
    <!-- 'nest' makes the kit insert its <svg> INSIDE each <i> instead of replacing
         the <i>, so React keeps ownership of the node it rendered. Without this,
         conditionally-rendered / reordered FA icons crash React with
         "removeChild ... is not a child of this node". -->
    <script>window.FontAwesomeConfig = { autoReplaceSvg: 'nest' };</script>
    <script src="https://kit.fontawesome.com/5c6e8fb683.js" crossorigin="anonymous"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

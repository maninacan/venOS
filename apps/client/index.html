<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Venview</title>
    <meta name="description" content="Venview — profit tracking for event vendors. Know your real margin after every market, festival, and pop-up." />
    <base href="/" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0B2A4A" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/venview-icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/src/styles.css" />
    <!-- 'nest' makes the kit insert its <svg> INSIDE each <i> instead of replacing
         the <i>, so React keeps ownership of the node it rendered. Without this,
         conditionally-rendered / reordered FA icons crash React with
         "removeChild ... is not a child of this node". -->
    <script>window.FontAwesomeConfig = { autoReplaceSvg: 'nest' };</script>
    <script src="https://kit.fontawesome.com/5c6e8fb683.js" crossorigin="anonymous"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
